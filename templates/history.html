<!doctype html>
<html>
  <head>
    <title>History</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="container mt-4">
    <h2>📜 Analysis History</h2>

    <table class="table table-striped mt-3">
      <thead>
        <tr>
          <th>Time</th>
          <th>Image</th>
          <th>Result</th>
          <th>Confidence</th>
          <th>Risk</th>
        </tr>
      </thead>

      <tbody>
        {% for item in history %}
        <tr>
          <td>{{ item.time }}</td>
          <td>{{ item.name }}</td>
          <td>{{ item.result }}</td>
          <td>{{ item.confidence }}%</td>
          <td>{{ item.risk }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
