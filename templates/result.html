<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analysis Result</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #eff5ea 0%, #dfeaf5 100%);
      }

      .page-wrap {
        padding: 48px 16px;
      }

      .result-card {
        max-width: 840px;
        margin: 0 auto;
        padding: 32px;
        border: 0;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 20px 60px rgba(34, 52, 74, 0.14);
      }

      .result-image {
        width: 100%;
        max-width: 320px;
        border-radius: 18px;
        border: 1px solid #d8e2e8;
      }

      .risk-box {
        padding: 18px;
        border-radius: 18px;
        color: #fff;
      }

      .low {
        background: #2e8b57;
      }

      .medium {
        background: #d97706;
      }

      .high {
        background: #c0392b;
      }
    </style>
  </head>
  <body>
    <main class="page-wrap">
      <section class="result-card">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
          <div>
            <h1 class="h3 mb-1">Skin Cancer Analysis Result</h1>
            <p class="text-muted mb-0">Review the AI-assisted assessment below.</p>
          </div>
          <div class="d-flex gap-2">
            <a href="/download_pdf" class="btn btn-danger">Download PDF Report</a>
            <a href="/" class="btn btn-outline-secondary">New Analysis</a>
          </div>
        </div>

        <div class="row g-4 align-items-start">
          <div class="col-lg-7">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <div class="border rounded-4 p-3 h-100">
                  <div class="text-muted small">Patient Name</div>
                  <div class="fw-semibold">{{ first_name }} {{ last_name }}</div>
                </div>
              </div>
              <div class="col-md-3">
                <div class="border rounded-4 p-3 h-100">
                  <div class="text-muted small">Age</div>
                  <div class="fw-semibold">{{ age }}</div>
                </div>
              </div>
              <div class="col-md-3">
                <div class="border rounded-4 p-3 h-100">
                  <div class="text-muted small">Gender</div>
                  <div class="fw-semibold">{{ gender }}</div>
                </div>
              </div>
              <div class="col-12">
                <div class="border rounded-4 p-3">
                  <div class="text-muted small">Body Part</div>
                  <div class="fw-semibold">{{ body_part }}</div>
                </div>
              </div>
            </div>

            <div
              class="risk-box {% if risk == 'Low' %}low{% elif risk == 'Medium' %}medium{% else %}high{% endif %}"
            >
              <h2 class="h4 mb-3">Diagnosis: {{ result }}</h2>
              <p class="mb-2">Confidence: {{ confidence }}%</p>
              <p class="mb-0">Risk Level: {{ risk }}</p>
            </div>
          </div>

          <div class="col-lg-5 text-center">
            <img
              class="result-image"
              src="{{ url_for('static', filename='uploads/' + image) }}"
              alt="Uploaded skin image"
            />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
