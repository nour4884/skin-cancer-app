<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f5f6fa;
      }

      .card {
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .title {
        text-align: center;
        margin: 30px 0;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1 class="title">📊 Dashboard</h1>

      <div class="row g-4">
        <!-- Total Patients -->
        <div class="col-md-3">
          <div class="card text-center p-3">
            <h5>Total Patients</h5>
            <h2>{{ total_patients }}</h2>
          </div>
        </div>

        <!-- Total Analyses -->
        <div class="col-md-3">
          <div class="card text-center p-3">
            <h5>Total Analyses</h5>
            <h2>{{ total_analyses }}</h2>
          </div>
        </div>

        <!-- Benign Cases -->
        <div class="col-md-3">
          <div class="card text-center p-3">
            <h5>Benign Cases</h5>
            <h2>{{ benign_cases }}</h2>
          </div>
        </div>

        <!-- Malignant Cases -->
        <div class="col-md-3">
          <div class="card text-center p-3">
            <h5>Malignant Cases</h5>
            <h2>{{ malignant_cases }}</h2>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
